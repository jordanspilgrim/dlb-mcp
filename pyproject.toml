[project]
name = "dlb-mcp"
version = "0.1.0"
description = "Dead Letter Box: a tiny MCP server for independent agent sessions to leave each other notes. Six tools, no daemon, real dead-letter semantics."
readme = "README.md"
authors = [{ name = "Jordan S Pilgrim" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/jordanspilgrim/dlb-mcp"
Repository = "https://github.com/jordanspilgrim/dlb-mcp"
Issues = "https://github.com/jordanspilgrim/dlb-mcp/issues"

[project.scripts]
dlb-mcp = "dlb_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlb_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
